# Nous-approved MCP catalog candidate for Hermes Agentic Trader repair.
# Paper-safe surface only by default. Raw write tools are intentionally not
# enabled until the repaired quote-bound execution gate is complete.
manifest_version: 1

name: defi-trading
description: Base/EVM DeFi market data, portfolio reads, and swap quotes via defi-trading-mcp.
source: https://github.com/edkdev/defi-trading-mcp

transport:
  type: stdio
  command: npx
  args:
    - "-y"
    - "defi-trading-mcp@2.1.3"

auth:
  type: api_key
  env:
    - name: USER_ADDRESS
      prompt: "EVM wallet address (0x...)"
      required: true
      secret: false
    - name: USER_PRIVATE_KEY
      prompt: "EVM private key (leave blank in paper mode; required only for future live execution)"
      required: false
      secret: true
      default: ""
    - name: COINGECKO_API_KEY
      prompt: "CoinGecko API key"
      required: true
      secret: true
    - name: ALCHEMY_API_KEY
      prompt: "Alchemy API key (optional)"
      required: false
      secret: true
      default: ""

tools:
  default_enabled:
    - get_portfolio_tokens
    - get_portfolio_balances
    - get_portfolio_transactions
    - get_trending_pools_by_network
    - get_pool_ohlcv
    - get_pool_trades
    - get_token_price
    - get_token_data
    - get_token_info
    - search_pools
    - get_swap_price
    - get_swap_quote
    - get_supported_chains
    - get_gasless_price
    - get_gasless_quote
    - get_gasless_status
    - get_gasless_chains
    - get_gasless_approval_tokens
    - convert_wei_to_formatted
    - convert_formatted_to_wei

post_install: |
  Hermes Agentic Trader repair defaults to paper-safe reads and quotes.

  Enable the bundled safety plugin before using this MCP:
    hermes plugins enable hermes-agentic-trader

  Configure trader settings under trader: in ~/.hermes/config.yaml.

  execute_swap and submit_gasless_swap are intentionally not in the default
  tool surface. The repair plugin also blocks those raw write calls until the
  quote-bound live risk gate is complete.

  USER_PRIVATE_KEY is not required for paper mode. Never commit private keys.
